; EDEN//FALL v0.5.0 export matrix for Godot 4.7.1.
; Credentials are intentionally excluded. Release signing is injected through
; environment variables or .godot/export_credentials.cfg.

[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="desktop"
export_filter="all_resources"
include_filter="*.json,*.txt,*.md"
exclude_filter="validation/*,docs/*,.github/*"
export_path="build/windows/EDEN_FALL.exe"
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/icon="res://icon.svg"
application/product_name="EDEN FALL"
application/file_description="Industrial Garden of Eden action roguelike"
application/copyright="Gameish"

