name: Materialize Godmode Expansion

on:
  push:
    branches: [godmode/production-expansion]
    paths:
      - ".godmode/**"
      - ".github/workflows/bootstrap_godmode.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".godmode/**"
      - ".github/workflows/bootstrap_godmode.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: godmode/production-expansion
          fetch-depth: 0

      - name: Detect staged source payload
        id: payload
        shell: bash
        run: |
          if compgen -G ".godmode/part_*.b64" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Payload already materialized; nothing to do."
          fi

      - name: Verify staged segments
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/parts.sha256 <<'EOF'
          b12de04dc72914587ad5e55669f0fdfe5fa3618258726206331dcbff468db15d  .godmode/part_00.b64
          4c66c1f1b56cad16938aa4fdad5ba76a2cee2dc51705101f017b75e053d9424d  .godmode/part_01.b64
          bb29a7a333dd5a988e44ecde58c03cc2077f6a00d32db0e4929122ecb944ddcd  .godmode/part_02.b64
          677e014ab56d70bc1653c8637fba9ff50bd2dec111faf62b1626433e7c59edf0  .godmode/part_03.b64
          52bbfe8a8b79c80327616469a784fc5537050dc71e5ad38520d005a4fa1fbefe  .godmode/part_04.b64
          EOF
          wc -c .godmode/part_*.b64
          sha256sum .godmode/part_*.b64
          sha256sum --check --strict /tmp/parts.sha256

      - name: Reconstruct and verify source bundle
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .godmode/part_*.b64 > /tmp/gameish-godmode.b64
          echo "f6f81c991b6d505188c0c5be18bad36cc45b591ec190af5ccf7ae47295b61f6a  /tmp/gameish-godmode.b64" | sha256sum --check --strict
          base64 --decode /tmp/gameish-godmode.b64 > /tmp/gameish-godmode.zip
          echo "3a138f73cea4006d7e4770b9bd2a274fe0afd40656f0ddcf7ba2e7b2def6fe3b  /tmp/gameish-godmode.zip" | sha256sum --check --strict
          unzip -t /tmp/gameish-godmode.zip
          unzip -o /tmp/gameish-godmode.zip -d .
          rm -rf .godmode

      - name: Commit materialized production source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Implement EDEN FALL production expansion [materialized]"
          git push origin HEAD:godmode/production-expansion
