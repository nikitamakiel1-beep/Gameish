name: Generate EDEN FALL Assets

on:
  workflow_dispatch:
  push:
    branches: [godmode/production-expansion]
    paths:
      - tools/generate_assets.py
      - scripts/asset_catalog.gd
      - scripts/audio_director.gd
      - scripts/game_runtime.gd
      - .github/workflows/generate-assets.yml

permissions:
  contents: write

concurrency:
  group: eden-fall-generated-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: godmode/production-expansion
          persist-credentials: true

      - name: Generate original visual and audio assets
        run: python3 tools/generate_assets.py --out assets/generated

      - name: Validate generated package
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import struct
          import wave

          root = pathlib.Path('assets/generated')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert len(manifest['players']) == 5
          assert sum(len(v) for v in manifest['enemies'].values()) == 25
          assert len(manifest['bosses']) == 5
          assert len(manifest['weapons']) == 10
          assert len(manifest['music']) == 5
          assert len(manifest['ambience']) == 5
          assert len(manifest['sfx']) >= 20
          assert len(manifest['files']) >= 84

          for png in root.rglob('*.png'):
              data = png.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', png
              width, height = struct.unpack('>II', data[16:24])
              assert width > 0 and height > 0, png

          for wav_path in root.rglob('*.wav'):
              with wave.open(str(wav_path), 'rb') as wav:
                  assert wav.getnchannels() == 1
                  assert wav.getsampwidth() == 2
                  assert wav.getframerate() == 22050
                  assert wav.getnframes() > 1000

          print('Validated', len(manifest['files']), 'generated assets')
          PY

      - name: Commit generated PNG and WAV files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --cached --quiet; then
            echo "Generated assets already match the deterministic source."
            exit 0
          fi
          git commit -m "Generate production sprites, animation sheets and audio [assets]"
          git push origin HEAD:godmode/production-expansion
