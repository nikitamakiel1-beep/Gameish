name: Build and publish EDEN FALL v0.6 from production branch

on:
  push:
    branches:
      - godmode/production-assets-v6-rebuild
  pull_request:
    branches:
      - godmode/godot-4.7.1-multiplatform-v5
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  issues: write
  pull-requests: write

concurrency:
  group: eden-fall-v6-gh-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_LINUX_ZIP: "Godot_v4.7.1-stable_linux.x86_64.zip"
  GODOT_TEMPLATES: "Godot_v4.7.1-stable_export_templates.tpz"
  SOURCE_BRANCH: "godmode/production-assets-v6-rebuild"
  PAGES_BRANCH: "gh-pages"

jobs:
  publish:
    name: Verify, export, publish and build Pages
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl unzip libfontconfig1 libxcursor1 libxinerama1 libxi6 \
            libxrandr2 libgl1 libasound2t64

      - name: Install official Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$RUNNER_TEMP/godot-${GODOT_VERSION}"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$GODOT_DIR" "$TEMPLATE_DIR" validation/pages

          curl --fail --location --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/${GODOT_LINUX_ZIP}" \
            --output "$GODOT_DIR/godot.zip"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/${GODOT_TEMPLATES}" \
            --output "$GODOT_DIR/templates.tpz"

          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          unzip -q "$GODOT_DIR/templates.tpz" -d "$GODOT_DIR/templates"
          cp -R "$GODOT_DIR/templates/templates/." "$TEMPLATE_DIR/"

          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot*' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version | tee validation/pages/engine-version.log
          grep -E '^4\.7\.1\.stable' validation/pages/engine-version.log

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --audio-driver Dummy --path . \
            --editor --quit --verbose > validation/pages/import.log 2>&1

      - name: Validate production asset factory
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --audio-driver Dummy --path . \
            --script tests/v6_factory_audit.gd \
            > validation/pages/factory-audit.log 2>&1
          grep -F 'EDEN_FALL_V6_FACTORY_AUDIT=PASS' validation/pages/factory-audit.log

      - name: Boot bounded v0.6 runtime
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT_BIN" --headless --audio-driver Dummy --path . \
            --quit-after 120 --verbose > validation/pages/boot.log 2>&1

      - name: Export and verify Web package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web

          "$GODOT_BIN" --headless --audio-driver Dummy --path . \
            --export-release "Web" "build/web/index.html" \
            > validation/pages/export.log 2>&1

          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck

          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

          cat > build/web/build-info.json <<EOF
          {
            "project": "EDEN//FALL",
            "version": "0.6.0",
            "godot": "4.7.1",
            "source_commit": "$(git rev-parse HEAD)",
            "source_branch": "${SOURCE_BRANCH}",
            "published_branch": "${PAGES_BRANCH}",
            "playable": true,
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot get class|FATAL:' validation/pages/*.log; then
            exit 1
          fi

          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' \
            | sort | tee validation/pages/web-files.log
          sha256sum build/web/* | tee validation/pages/web-sha256.txt

      - name: Force-publish verified package to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd build/web
          git init
          git checkout -b "$PAGES_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish EDEN FALL v0.6 from $(git -C ../.. rev-parse HEAD)"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$PAGES_BRANCH"

      - name: Request and verify GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/pages

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds" \
            | tee validation/pages/pages-build-request.json

          for attempt in $(seq 1 90); do
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
              > validation/pages/pages-build-latest.json

            STATUS="$(jq -r '.status // "unknown"' validation/pages/pages-build-latest.json)"
            ERROR_MESSAGE="$(jq -r '.error.message // ""' validation/pages/pages-build-latest.json)"
            BUILD_COMMIT="$(jq -r '.commit // ""' validation/pages/pages-build-latest.json)"
            echo "Pages build attempt ${attempt}: status=${STATUS} commit=${BUILD_COMMIT} error=${ERROR_MESSAGE}"

            if [ "$STATUS" = "built" ]; then
              echo "PAGES_BUILD_STATUS=built" >> "$GITHUB_ENV"
              break
            fi

            if [ "$STATUS" = "errored" ]; then
              echo "GitHub Pages build failed: ${ERROR_MESSAGE}" >&2
              exit 1
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "GitHub Pages build did not complete within 7.5 minutes." >&2
              exit 1
            fi

            sleep 5
          done

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-fall-v6-pages-validation-${{ github.run_id }}
          path: validation/pages
          if-no-files-found: error
          retention-days: 14

      - name: Report branch-only deployment result to PR 8
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PAGES_STATUS: ${{ env.PAGES_BUILD_STATUS }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAGE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          if [ "$JOB_STATUS" = "success" ] && [ "$PAGES_STATUS" = "built" ]; then
            BODY="<!-- eden-fall-pages -->
            **GitHub Pages build completed successfully.**

            Source: \`${SOURCE_BRANCH}\` at \`${SOURCE_SHA}\`
            Published to: \`${PAGES_BRANCH}\`
            GitHub Pages status: \`built\`
            Play URL: ${PAGE_URL}

            No build or deployment step uses \`main\`. [Build and deployment evidence](${RUN_URL})."
          else
            BODY="<!-- eden-fall-pages -->
            **GitHub Pages build failed or timed out.**

            Job status: \`${JOB_STATUS}\`
            Pages status: \`${PAGES_STATUS:-unavailable}\`
            Source: \`${SOURCE_BRANCH}\` at \`${SOURCE_SHA}\`

            No build or deployment step uses \`main\`. [Open the exact failure and logs](${RUN_URL})."
          fi

          gh pr comment 8 --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none --body "$BODY"
