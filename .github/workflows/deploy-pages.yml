name: Deploy verified EDEN FALL package

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: eden-fall-pages-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish gh-pages root
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Prepare site artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ "$RUNNER_TEMP/site/"

          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/index.js"
          test -s "$RUNNER_TEMP/site/index.wasm"
          test -s "$RUNNER_TEMP/site/index.pck"
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report live deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            BODY="<!-- eden-fall-pages-live -->
            **GitHub Pages API deployment succeeded.**

            Live URL: ${PAGE_URL}
            Source branch: \`gh-pages\`
            Deployment commit: \`${GITHUB_SHA}\`

            [Deployment run](${RUN_URL})."
          else
            BODY="<!-- eden-fall-pages-live -->
            **GitHub Pages API deployment failed.**

            Outcome: \`${DEPLOY_OUTCOME}\`
            Source branch: \`gh-pages\`
            Deployment commit: \`${GITHUB_SHA}\`

            [Open the exact failure](${RUN_URL})."
          fi
          gh pr comment 8 --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none --body "$BODY"
