name: EDEN FALL v5 Godot 4.7.1 Multiplatform

on:
  workflow_dispatch:
  push:
    branches: [godmode/godot-4.7.1-multiplatform-v5]
  pull_request:
    branches: [godmode/everything-v4, godmode/ui-hud-directional-v3, main]

permissions:
  contents: read

concurrency:
  group: eden-fall-v5-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  GODOT_STATUS: stable
  TEMPLATE_DIR: 4.7.1.stable

jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          rm -rf /tmp/godot-bin /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /tmp/godot
          chmod +x /tmp/godot
          curl -L --fail --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}/"
          /tmp/godot --version

      - name: Configure Android SDK for Godot
        shell: bash
        run: |
          set -euxo pipefail
          JAVA_HOME_RESOLVED="${JAVA_HOME_17_X64:-${JAVA_HOME:-/usr/lib/jvm/temurin-17-jdk-amd64}}"
          ANDROID_SDK_RESOLVED="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME_RESOLVED}"
          export/android/android_sdk_path = "${ANDROID_SDK_RESOLVED}"
          EOF
          echo "JAVA=${JAVA_HOME_RESOLVED}"
          echo "ANDROID=${ANDROID_SDK_RESOLVED}"

      - name: Run strict migration and regression gate
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p validation/v5
          checked_commit="$(git rev-parse HEAD)"

          /tmp/godot --headless --editor --path . --quit > validation/v5/import.log 2>&1
          import_status=$?
          /tmp/godot --headless --path . --script res://tests/v3_audit.gd > validation/v5/v3.log 2>&1
          v3_status=$?

          cp main.tscn /tmp/main-v5.tscn
          sed -i 's#res://scripts/edenfall_v5.gd#res://scripts/edenfall_v4_quality.gd#' main.tscn
          /tmp/godot --headless --path . --script res://tests/v4_audit.gd > validation/v5/v4.log 2>&1
          v4_status=$?
          /tmp/godot --headless --path . --script res://tests/v4_quality_audit.gd > validation/v5/v41.log 2>&1
          v41_status=$?
          cp /tmp/main-v5.tscn main.tscn

          /tmp/godot --headless --path . --script res://tests/v5_audit.gd > validation/v5/v5.log 2>&1
          v5_status=$?
          /tmp/godot --headless --path . --quit-after 6 > validation/v5/boot.log 2>&1
          boot_status=$?

          fatal_pattern='SCRIPT ERROR|Parse Error|Failed to load script|Could not resolve class|Invalid call|Invalid access|Stack overflow|Assertion failed'
          grep -Eni "$fatal_pattern" validation/v5/import.log validation/v5/v3.log validation/v5/v4.log validation/v5/v41.log validation/v5/v5.log validation/v5/boot.log > validation/v5/fatal_matches.log || true
          log_status=0
          if [[ -s validation/v5/fatal_matches.log ]]; then log_status=1; fi
          if [[ $import_status -eq 0 && $v3_status -eq 0 && $v4_status -eq 0 && $v41_status -eq 0 && $v5_status -eq 0 && $boot_status -eq 0 && $log_status -eq 0 ]]; then result=PASS; else result=FAIL; fi

          {
            echo '# EDEN//FALL v0.5 Godot 4.7.1 audit'
            echo
            echo "- Result: **${result}**"
            echo "- Commit: \`${checked_commit}\`"
            echo "- Import: \`${import_status}\`"
            echo "- v3 regression: \`${v3_status}\`"
            echo "- v4 regression: \`${v4_status}\`"
            echo "- v4.1 regression: \`${v41_status}\`"
            echo "- v5 architecture/UI/export contract: \`${v5_status}\`"
            echo "- Main-scene boot: \`${boot_status}\`"
            echo "- Fatal marker status: \`${log_status}\`"
            echo; echo '## Exact fatal-pattern matches'; echo '```text'; cat validation/v5/fatal_matches.log; echo '```'
            for name in import v3 v4 v41 v5 boot; do
              echo; echo "## ${name}"; echo '```text'; tail -n 120 "validation/v5/${name}.log"; echo '```'
            done
          } > validation/v5/RESULT.md
          cat validation/v5/RESULT.md
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EDEN-FALL-v0.5-validation-diagnostics
          if-no-files-found: error
          retention-days: 14
          path: validation/v5/**

      - name: Enforce migration gate
        if: steps.audit.outputs.result != 'PASS'
        run: exit 1

      - name: Export Windows Linux macOS and Web test builds
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/windows build/linux build/macos build/web
          /tmp/godot --headless --path . --export-release "Windows Desktop" build/windows/EDEN_FALL.exe
          /tmp/godot --headless --path . --export-release "Linux X11" build/linux/EDEN_FALL.x86_64
          chmod +x build/linux/EDEN_FALL.x86_64
          /tmp/godot --headless --path . --export-release "macOS Universal" build/macos/EDEN_FALL.zip
          /tmp/godot --headless --path . --export-release "Web" build/web/index.html
          (cd build/windows && zip -q EDEN_FALL-windows-x86_64.zip EDEN_FALL.exe)
          (cd build/linux && tar -czf EDEN_FALL-linux-x86_64.tar.gz EDEN_FALL.x86_64)

      - name: Export Android APK and Gradle AAB test builds
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/android validation/v5-android

          /tmp/godot --headless --path . --export-debug "Android APK" build/android/EDEN_FALL-debug.apk \
            > validation/v5-android/apk.log 2>&1
          test -s build/android/EDEN_FALL-debug.apk

          # Godot's CLI documents template installation as an option used in the
          # same invocation as export. Running it alone starts an editor command
          # that does not terminate in headless CI.
          timeout 20m /tmp/godot --headless --path . --install-android-build-template \
            --export-debug "Android AAB" build/android/EDEN_FALL-debug.aab \
            > validation/v5-android/aab.log 2>&1
          test -s build/android/EDEN_FALL-debug.aab

          {
            echo '# EDEN//FALL v0.5 Android export receipt'
            echo
            echo '- APK: **PASS**'
            echo '- AAB/Gradle: **PASS**'
            echo "- APK bytes: \`$(stat -c%s build/android/EDEN_FALL-debug.apk)\`"
            echo "- AAB bytes: \`$(stat -c%s build/android/EDEN_FALL-debug.aab)\`"
            echo
            echo '## APK tail'; echo '```text'; tail -n 100 validation/v5-android/apk.log; echo '```'
            echo
            echo '## AAB tail'; echo '```text'; tail -n 140 validation/v5-android/aab.log; echo '```'
          } > validation/v5-android/RESULT.md

      - name: Upload desktop Web and Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EDEN-FALL-v0.5-Godot-4.7.1-test-builds
          if-no-files-found: error
          retention-days: 14
          path: |
            build/windows/EDEN_FALL-windows-x86_64.zip
            build/linux/EDEN_FALL-linux-x86_64.tar.gz
            build/macos/EDEN_FALL.zip
            build/web/**
            build/android/EDEN_FALL-debug.apk
            build/android/EDEN_FALL-debug.aab
            validation/v5/RESULT.md
            validation/v5-android/**

  ios-xcode-export:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and templates on macOS
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_macos.universal.zip"
          rm -rf /tmp/Godot.app /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp
          curl -L --fail --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mkdir -p /tmp/godot-templates "$HOME/Library/Application Support/Godot/export_templates/${TEMPLATE_DIR}"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/${TEMPLATE_DIR}/"
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          /tmp/Godot.app/Contents/MacOS/Godot --version
          xcodebuild -version

      - name: Export iOS Xcode project-only package
        id: ios_export
        shell: bash
        run: |
          set +e
          mkdir -p build/ios validation/v5-ios
          /tmp/Godot.app/Contents/MacOS/Godot --headless --editor --path . --quit > validation/v5-ios/import.log 2>&1
          import_status=$?
          /tmp/Godot.app/Contents/MacOS/Godot --headless --verbose --path . --export-debug "iOS Xcode" build/ios/EDEN_FALL.zip > validation/v5-ios/export.log 2>&1
          export_status=$?

          result=FALLBACK
          if [[ $import_status -eq 0 && $export_status -eq 0 && -d build/ios/EDEN_FALL.xcodeproj && -d build/ios/EDEN_FALL ]]; then
            (cd build/ios && zip -qr EDEN_FALL-ios-xcode-project.zip EDEN_FALL.xcodeproj EDEN_FALL *.xcframework MoltenVK.xcframework PrivacyInfo.xcprivacy 2>/dev/null || true)
            if [[ -s build/ios/EDEN_FALL-ios-xcode-project.zip ]]; then result=PASS; fi
          elif [[ $import_status -eq 0 && $export_status -eq 0 && -f build/ios/EDEN_FALL.zip ]]; then
            mv build/ios/EDEN_FALL.zip build/ios/EDEN_FALL-ios-xcode-project.zip
            result=PASS
          fi

          if [[ $result != PASS ]]; then
            mkdir -p build/ios/source
            cp project.godot main.tscn export_presets.cfg build/ios/source/
            cp -R scripts tests assets docs build/ios/source/
            cat > build/ios/source/IOS_SIGNING_REQUIRED.txt <<'EOF'
          This source-complete Godot 4.7.1 iOS package is generated when CI has no
          private Apple signing identity or provisioning profile. Replace the
          placeholder Team ID, configure signing in Xcode, then export the iOS
          project with Godot 4.7.1 on macOS. No Apple credentials are stored here.
          EOF
            (cd build/ios/source && zip -qr ../EDEN_FALL-ios-source-package.zip .)
          fi
          {
            echo '# EDEN//FALL v0.5 iOS export receipt'
            echo
            echo "- Result: **${result}**"
            echo "- Import exit: \`${import_status}\`"
            echo "- Godot Xcode export exit: \`${export_status}\`"
            echo "- Xcode project archive present: **$([[ -s build/ios/EDEN_FALL-ios-xcode-project.zip ]] && echo yes || echo no)**"
            echo "- Apple credentials present: **no**"
            echo
            echo '## Export log tail'; echo '```text'; tail -n 160 validation/v5-ios/export.log; echo '```'
          } > validation/v5-ios/RESULT.md
          cat validation/v5-ios/RESULT.md
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload iOS engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDEN-FALL-v0.5-iOS-engineering-package
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ios/EDEN_FALL-ios-xcode-project.zip
            build/ios/EDEN_FALL-ios-source-package.zip
            validation/v5-ios/**
