name: EDEN FALL v4 Everything Gate

on:
  workflow_dispatch:
  push:
    branches: [godmode/everything-v4]
  pull_request:
    branches: [godmode/ui-hud-directional-v3, godmode/production-expansion, main]

permissions:
  contents: read

concurrency:
  group: eden-fall-v4-everything
  cancel-in-progress: true

jobs:
  validate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: godmode/everything-v4

      - name: Install Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          mv /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot

      - name: Run strict v0.4 audit
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p validation
          checked_commit="$(git rev-parse HEAD)"

          /tmp/godot --headless --editor --path . --quit > validation/v4_import.log 2>&1
          import_status=$?
          /tmp/godot --headless --path . --script res://tests/v3_audit.gd > validation/v4_regression.log 2>&1
          regression_status=$?
          /tmp/godot --headless --path . --script res://tests/v4_audit.gd > validation/v4_audit.log 2>&1
          audit_status=$?
          /tmp/godot --headless --path . --quit-after 6 > validation/v4_boot.log 2>&1
          boot_status=$?

          fatal_pattern='SCRIPT ERROR|Parse Error|Failed to load script|Could not resolve class|Invalid call|Invalid access|Stack overflow|Assertion failed'
          log_status=0
          if grep -Eqi "$fatal_pattern" validation/v4_import.log validation/v4_regression.log validation/v4_audit.log validation/v4_boot.log; then
            log_status=1
          fi

          if [[ $import_status -eq 0 && $regression_status -eq 0 && $audit_status -eq 0 && $boot_status -eq 0 && $log_status -eq 0 ]]; then
            result=PASS
          else
            result=FAIL
          fi

          {
            echo '# EDEN//FALL v0.4 strict readiness audit'
            echo
            echo "- Result: **${result}**"
            echo "- Source commit: \`${checked_commit}\`"
            echo "- Import/parse exit: \`${import_status}\`"
            echo "- v3 regression exit: \`${regression_status}\`"
            echo "- v4 behavioral audit exit: \`${audit_status}\`"
            echo "- Main-scene boot exit: \`${boot_status}\`"
            echo "- Fatal log marker status: \`${log_status}\`"
            echo
            echo '## Import tail'; echo '```text'; tail -n 100 validation/v4_import.log; echo '```'
            echo
            echo '## v3 regression tail'; echo '```text'; tail -n 80 validation/v4_regression.log; echo '```'
            echo
            echo '## v4 audit tail'; echo '```text'; tail -n 100 validation/v4_audit.log; echo '```'
            echo
            echo '## Boot tail'; echo '```text'; tail -n 100 validation/v4_boot.log; echo '```'
          } > validation/V4_RESULT.md

          cat validation/V4_RESULT.md
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce v0.4 gate
        if: steps.audit.outputs.result != 'PASS'
        run: exit 1
