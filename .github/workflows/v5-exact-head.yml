name: EDEN FALL v5 Exact Head Gate

on:
  workflow_dispatch:
  push:
    branches: [godmode/godot-4.7.1-multiplatform-v5]
  pull_request:
    branches: [godmode/everything-v4, main]

permissions:
  contents: read

concurrency:
  group: eden-fall-v5-exact-head
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact v5 branch head
        uses: actions/checkout@v4
        with:
          ref: godmode/godot-4.7.1-multiplatform-v5
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euxo pipefail
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/godmode/godot-4.7.1-multiplatform-v5 | cut -f1)"
          test -n "$remote_head"
          test "$local_head" = "$remote_head"
          echo "$local_head" > /tmp/exact_head

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          rm -rf /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          mv /tmp/godot-bin/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version

      - name: Validate exact committed source
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p validation/v5-head
          checked_commit="$(cat /tmp/exact_head)"

          /tmp/godot --headless --editor --path . --quit > validation/v5-head/import.log 2>&1
          import_status=$?
          /tmp/godot --headless --path . --script res://tests/v3_audit.gd > validation/v5-head/v3.log 2>&1
          v3_status=$?

          cp main.tscn /tmp/main-v5-head.tscn
          sed -i 's#res://scripts/edenfall_v5.gd#res://scripts/edenfall_v4_quality.gd#' main.tscn
          /tmp/godot --headless --path . --script res://tests/v4_audit.gd > validation/v5-head/v4.log 2>&1
          v4_status=$?
          /tmp/godot --headless --path . --script res://tests/v4_quality_audit.gd > validation/v5-head/v41.log 2>&1
          v41_status=$?
          cp /tmp/main-v5-head.tscn main.tscn

          /tmp/godot --headless --path . --script res://tests/v5_audit.gd > validation/v5-head/v5.log 2>&1
          v5_status=$?
          /tmp/godot --headless --path . --quit-after 6 > validation/v5-head/boot.log 2>&1
          boot_status=$?

          fatal_pattern='SCRIPT ERROR|Parse Error|Failed to load script|Could not resolve class|Invalid call|Invalid access|Stack overflow|Assertion failed'
          grep -Eni "$fatal_pattern" validation/v5-head/*.log > validation/v5-head/fatal_matches.log || true
          fatal_status=0
          if [[ -s validation/v5-head/fatal_matches.log ]]; then fatal_status=1; fi

          if [[ $import_status -eq 0 && $v3_status -eq 0 && $v4_status -eq 0 && $v41_status -eq 0 && $v5_status -eq 0 && $boot_status -eq 0 && $fatal_status -eq 0 ]]; then result=PASS; else result=FAIL; fi
          {
            echo '# EDEN//FALL v0.5 exact-head validation'
            echo
            echo "- Result: **${result}**"
            echo "- Exact branch commit: \`${checked_commit}\`"
            echo '- Godot: `4.7.1.stable`'
            echo "- Import: \`${import_status}\`"
            echo "- v3: \`${v3_status}\`"
            echo "- v4: \`${v4_status}\`"
            echo "- v4.1: \`${v41_status}\`"
            echo "- v5: \`${v5_status}\`"
            echo "- Boot: \`${boot_status}\`"
            echo "- Fatal markers: \`${fatal_status}\`"
            echo; echo '## Fatal matches'; echo '```text'; cat validation/v5-head/fatal_matches.log; echo '```'
            for name in import v3 v4 v41 v5 boot; do
              echo; echo "## ${name}"; echo '```text'; tail -n 100 "validation/v5-head/${name}.log"; echo '```'
            done
          } > validation/v5-head/RESULT.md
          cat validation/v5-head/RESULT.md
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EDEN-FALL-v0.5-exact-head-receipt
          if-no-files-found: error
          retention-days: 14
          path: validation/v5-head/**

      - name: Enforce exact-head gate
        if: steps.gate.outputs.result != 'PASS'
        run: exit 1
