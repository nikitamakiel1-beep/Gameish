name: Validate Godot Project

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parse-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project and parse scripts
        run: ./godot --headless --editor --path . --quit

      - name: Boot vertical slice
        run: ./godot --headless --path . --quit-after 5
