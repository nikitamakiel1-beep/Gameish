name: Finalize Production Branch

on:
  push:
    branches: [godmode/production-expansion]
    paths:
      - .github/workflows/finalize-production-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: godmode/production-expansion
          persist-credentials: true

      - name: Remove obsolete transport and bootstrap infrastructure
        shell: bash
        run: |
          rm -rf .godmode
          rm -f .github/workflows/bootstrap_godmode.yml
          rm -f .github/workflows/godmode-bootstrap.yml
          rm -f .github/workflows/godmode-recover-materialize.yml
          rm -f .github/workflows/finalize-production-branch.yml

      - name: Commit clean production tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Production branch is already clean.'
            exit 0
          fi
          git commit -m "Remove obsolete source transport infrastructure"
          git pull --rebase origin godmode/production-expansion
          git push origin HEAD:godmode/production-expansion
