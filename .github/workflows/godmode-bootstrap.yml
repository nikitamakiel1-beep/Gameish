name: Materialize Godmode Expansion

on:
  push:
    branches: [godmode/production-expansion]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'godmode/production-expansion' || github.ref == 'refs/heads/godmode/production-expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: godmode/production-expansion
          persist-credentials: true
      - name: Check trigger
        run: test -f .godmode/READY
      - name: Reconstruct and validate archive
        run: |
          cat .godmode/part_*.b64 | base64 --decode > /tmp/gameish-godmode.zip
          unzip -t /tmp/gameish-godmode.zip
      - name: Materialize production source
        run: |
          unzip -o /tmp/gameish-godmode.zip -d .
          rm -f scripts/game_core.gd scripts/game.gd scripts/game_data.gd scripts/game_runtime.gd
          rm -rf .godmode
          rm -f .github/workflows/godmode-bootstrap.yml
      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize EDEN FALL production expansion"
          git push origin HEAD:godmode/production-expansion
