name: Materialize Godmode Expansion

on:
  push:
    branches: [godmode/production-expansion]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'godmode/production-expansion' || github.ref == 'refs/heads/godmode/production-expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: godmode/production-expansion
          persist-credentials: true

      - name: Detect complete staged bundle
        id: staged
        shell: bash
        run: |
          if [[ -f .godmode/COMPLETE ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and validate source capsule
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          cat \
            .godmode/xz_00.b64 \
            .godmode/xz_01.b64 \
            .godmode/xz_02.b64 \
            .godmode/xz_03.b64 \
            .godmode/xz_04.b64 \
            .godmode/xz_05a.b64 \
            .godmode/xz_05b.b64 \
            .godmode/xz_05.b64 \
            .godmode/xz_07a.b64 \
            .godmode/xz_07b.b64 \
            .godmode/xz_08a.b64 \
            .godmode/xz_08b.b64 \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/gameish-godmode.tar.xz
          echo "f2f1685f284a46df517af6caa9f265f27eacf0bd711781e2b00295c4f6e77f34  /tmp/gameish-godmode.tar.xz" | sha256sum -c -
          tar -tJf /tmp/gameish-godmode.tar.xz | tee /tmp/capsule-files.txt
          test "$(wc -l < /tmp/capsule-files.txt)" -eq 16
          grep -qx 'project.godot' /tmp/capsule-files.txt
          grep -qx 'main.tscn' /tmp/capsule-files.txt
          grep -qx 'scripts/game_director_v2.gd' /tmp/capsule-files.txt
          grep -qx 'scripts/content_database.gd' /tmp/capsule-files.txt
          grep -qx 'tests/content_validation.gd' /tmp/capsule-files.txt

      - name: Materialize production source
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          tar -xJf /tmp/gameish-godmode.tar.xz -C .
          rm -f scripts/game_core.gd scripts/game.gd scripts/game_data.gd scripts/game_runtime.gd
          rm -rf .godmode
          rm -f .github/workflows/godmode-bootstrap.yml .github/workflows/bootstrap_godmode.yml

      - name: Commit materialized source
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize EDEN FALL production expansion"
          git push origin HEAD:godmode/production-expansion
